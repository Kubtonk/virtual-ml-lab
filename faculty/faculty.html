<!doctype html>
<html>
<head><meta charset="utf-8"><title>Faculty Dashboard</title></head>
<body style="font-family:Arial; padding:20px;">
  <h1>Преподаватель — панель</h1>
  <p id="welcome"></p>
  <p>Здесь будут методички, задания и доступ к результатам студентов.</p>
  <p><a href="../index.html">← Назад</a> | <a href="#" id="logout">Выйти</a></p>

  <script>
    const name = sessionStorage.getItem('vl_username') || 'Гость';
    document.getElementById('welcome').innerText = 'Привет, ' + name + ' (faculty)';
    document.getElementById('logout').addEventListener('click', function(e){
      e.preventDefault();
      sessionStorage.clear();
      location.href = '../index.html';
    });
  </script>
</body>
</html>
